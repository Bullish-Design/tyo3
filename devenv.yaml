# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
  #nix2container:
  #  url: github:nlewo/nix2container
  #mk-shell-bin:
  #  url: github:rrbutani/nix-mk-shell-bin
  allium-env:
    url: github:Bullish-Design/allium-env?ref=v0.3.5
    flake: false

  # repoman: the manager conductor. `git` wires GitMan, which is why `gitman`
  # is on PATH in this shell. A published tag, fetched with git+https so the
  # git credential helper is used rather than nix's builtin fetcher.
  repoman:
    url: "git+https://github.com/Bullish-Design/repoman?dir=modules&ref=refs/tags/v0.7.5"
    flake: false

  # vendomat: delivers the *man commands as one pinned Nix store closure, and
  # sets `repoman.cliProvider = "store"` for us. Load-bearing HERE, not merely
  # tidy: under the "venv" provider RepoMan prepends the shared toolchain venv
  # to PATH, and that venv ships its own `python`. In a maturin project that
  # python would shadow the project venv and hide `_native_impl.abi3.so`, so
  # every `import tyo3` would fail. The store closure holds manager commands
  # only. Do NOT override cliProvider back to "venv" here.
  vendomat:
    url: "git+https://github.com/Bullish-Design/vendomat?ref=refs/tags/v0.3.9"

imports:
  - allium-env
  - vendomat/modules
  - repoman

# If you're using non-OSS software, you can set allowUnfree to true.
# allowUnfree: true

# If you're willing to use a package that's vulnerable
# permittedInsecurePackages:
#  - "openssl-1.1.1w"

