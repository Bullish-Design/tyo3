[project]
name = "tyo3"
version = "0.1.0"
description = "TyO3: Python semantic engine powered by ty/Ruff"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
  { name = "Bullish Design", email = "BullishDesignEngineering@gmail.com" },
]

dependencies = [
  "pydantic>=2.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.1",
  "ty>=0.0.40",
  "ruff>=0.5.0",
]

[project.scripts]
tyo3-demo = "tyo3.demo.runner:main"

[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "tyo3._native_impl"
manifest-path = "rust/Cargo.toml"
python-source = "src"

[tool.uv]

[tool.pytest.ini_options]
addopts = "-q --cov=tyo3 --cov-report=term-missing"
testpaths = ["src/tyo3/tests"]

[tool.ty]

[tool.ty.environment]
python-version = "3.13"
# ty is strict by default; file exclusions via .gitignore

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "hypothesis>=6.155.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
