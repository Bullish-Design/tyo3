[package]
name = "tyo3"
version = "0.4.0"
edition = "2021"

[lib]
name = "_native_impl"
crate-type = ["cdylib", "lib"]

[dependencies]
# ── PyO3 ───────────────────────────────────────────────
pyo3 = { version = "0.28", features = ["extension-module", "multiple-pymethods", "abi3-py313"] }

# ── Serialisation ──────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
pythonize = "0.28"

# ── Hashing ────────────────────────────────────────────
xxhash-rust = { version = "0.8", features = ["xxh3"] }  # 128-bit xxh3 for content hashing (Step 1)
ulid = "1"            # ULID generation for DurableId (Gate 2)

# ── Logging ────────────────────────────────────────────
log = "0.4"          # lightweight logging facade (replaces eprintln!)

# ── Content store ──────────────────────────────────────
rpds = "1"          # persistent (immutable, structurally-shared) HashTrieMap
arc-swap = "1"      # lock-free atomic swap of the live content generation

# ── Phase 9: cancel-retry on the floating warm fast path ─
# MUST match the version ty_project pins so salsa::Cancelled unwind payloads
# from ProjectDatabase queries downcast in our crate too.
salsa = { version = "0.26.1", default-features = false, features = [
    "compact_str", "macros", "salsa_unstable", "inventory",
] }

# ── ty/Ruff crates (ty v0.0.40) ────────────────────────
# ty v0.0.40 (astral-sh/ty tag 0.0.40) pins ruff submodule at
#   3cb09eba689ebb49e799131092121928cc789c18
ruff_db = { git = "https://github.com/astral-sh/ruff", rev = "3cb09eba689ebb49e799131092121928cc789c18", features = ["os"] }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", rev = "3cb09eba689ebb49e799131092121928cc789c18" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", rev = "3cb09eba689ebb49e799131092121928cc789c18" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", rev = "3cb09eba689ebb49e799131092121928cc789c18" }
ty_project = { git = "https://github.com/astral-sh/ruff", rev = "3cb09eba689ebb49e799131092121928cc789c18" }
ty_ide = { git = "https://github.com/astral-sh/ruff", rev = "3cb09eba689ebb49e799131092121928cc789c18" }
ty_python_semantic = { git = "https://github.com/astral-sh/ruff", rev = "3cb09eba689ebb49e799131092121928cc789c18" }
ty_module_resolver = { git = "https://github.com/astral-sh/ruff", rev = "3cb09eba689ebb49e799131092121928cc789c18" }
ty_python_core = { git = "https://github.com/astral-sh/ruff", rev = "3cb09eba689ebb49e799131092121928cc789c18" }
ruff_notebook = { git = "https://github.com/astral-sh/ruff", rev = "3cb09eba689ebb49e799131092121928cc789c18" }

[dev-dependencies]
tempfile = "3"      # real temp directories for OsSystem-backed tests
# Parser for hash.rs unit tests: parse a snippet → render its AST. Production
# code never re-parses (it reuses the ty db's already-parsed module).
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", rev = "3cb09eba689ebb49e799131092121928cc789c18" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Optimize all *dependencies* even in dev/debug builds (`maturin develop`).
# The ty type-checker, salsa, and ruff do heavy semantic analysis over the
# stdlib typeshed on every open/sync_all; unoptimized they dominate test time
# (~107s per fixture). The local `tyo3` crate stays at opt-level 0 so
# incremental rebuilds during development remain fast.
[profile.dev.package."*"]
opt-level = 3
