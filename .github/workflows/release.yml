# TyO3 — Release workflow
#
# Triggered by pushing a version tag (e.g. v0.1.0).
# Builds abi3 manylinux/macOS/Windows wheels via cibuildwheel/maturin-action
# and publishes to PyPI using trusted publishing (OIDC).
#
# The Rust extension targets abi3-py313, so one wheel works across
# CPython 3.13+ on every platform.

name: Release

on:
  push:
    tags:
      - "v*"

env:
  RUST_BACKTRACE: 1

jobs:
  # ── Build source + binary wheels ────────────────────────────────────

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target || 'auto' }}
          args: --release --out dist
          sccache: ${{ !startsWith(matrix.os, 'macos-') }}
          manylinux: auto
          before-script-linux: |
            # Manylinux images may need additional system deps for ty/Ruff
            # (ty depends on libstdc++ from the system)
            echo "Building on manylinux"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target || 'auto' }}
          path: dist/

  # ── Build sdist ─────────────────────────────────────────────────────

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  # ── Publish to PyPI ─────────────────────────────────────────────────

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # Required for trusted publishing (OIDC)

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
