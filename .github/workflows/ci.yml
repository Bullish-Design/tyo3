# TyO3 CI — Rust backend build + test pipeline
#
# Uses devenv to provision the pinned Rust toolchain, Python 3.13,
# and all build dependencies.  The build script (build-release) runs
# `maturin develop --release` which compiles the Rust extension and
# installs it into the venv in one step.
#
# Validation gates (must pass before merge):
#   1. ruff check .            — lint and formatting (Python)
#   2. cargo fmt --check        — Rust formatting
#   3. cargo clippy -- -D warnings — Rust lint with deny-warnings
#   4. build-release            — compile Rust extension
#   5. tests                    — full Python test suite with coverage
#   6. test-rust                — Rust unit + snapshot tests

name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".scratch/**"
      - ".agents/**"
  pull_request:
    branches: [main, master]

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Install devenv
        uses: cachix/devenv-action@v1

      # Optional: cache Cargo dependencies across builds
      # Uncomment if the initial build is too slow in CI:
      #
      # - name: Cache Cargo dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.cargo/registry
      #       ~/.cargo/git
      #       rust/target
      #     key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Ruff
        run: devenv shell -- ruff check .

      - name: Rust format
        run: devenv shell -- cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Rust clippy
        run: devenv shell -- cargo clippy --manifest-path rust/Cargo.toml -- -D warnings

      - name: Build native extension
        run: devenv shell -- build-release

      - name: Run Python tests
        run: devenv shell -- tests

      - name: Run Rust tests
        run: devenv shell -- test-rust
